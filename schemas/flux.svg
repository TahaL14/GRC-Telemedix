<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Télémédix : acteurs et flux de données (cas fictif)</text>

  <!-- Utilisateurs -->
  <rect x="20" y="70" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="105" y="95" text-anchor="middle" font-weight="bold" fill="#0c4a6e">Patient</text>
  <text x="105" y="114" text-anchor="middle" fill="#0c4a6e">web, iOS, Android</text>

  <rect x="20" y="200" width="170" height="60" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="105" y="225" text-anchor="middle" font-weight="bold" fill="#0c4a6e">Professionnel de santé</text>
  <text x="105" y="244" text-anchor="middle" fill="#0c4a6e">cabinet, centre, hôpital</text>

  <rect x="20" y="420" width="170" height="70" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="105" y="445" text-anchor="middle" font-weight="bold" fill="#78350f">Équipes Télémédix</text>
  <text x="105" y="464" text-anchor="middle" fill="#78350f">SRE, développeurs,</text>
  <text x="105" y="480" text-anchor="middle" fill="#78350f">support</text>

  <!-- Hébergeur HDS -->
  <rect x="300" y="50" width="390" height="460" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-dasharray="6 4"/>
  <text x="495" y="72" text-anchor="middle" font-weight="bold" fill="#14532d">Hébergeur certifié HDS (activités 1, 2, 3, 6) : France</text>

  <rect x="330" y="90" width="330" height="290" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="495" y="112" text-anchor="middle" font-weight="bold" fill="#14532d">Plateforme administrée par Télémédix (activité 5)</text>

  <rect x="350" y="128" width="290" height="46" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="495" y="156" text-anchor="middle" fill="#14532d">Front web et API (WAF à déployer)</text>
  <rect x="350" y="188" width="290" height="46" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="495" y="216" text-anchor="middle" fill="#14532d">Services : rendez-vous, dossier, ordonnance</text>
  <rect x="350" y="248" width="138" height="56" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="419" y="272" text-anchor="middle" fill="#14532d">Base de données</text>
  <text x="419" y="290" text-anchor="middle" fill="#14532d">chiffrée au repos</text>
  <rect x="502" y="248" width="138" height="56" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="571" y="272" text-anchor="middle" fill="#14532d">Stockage</text>
  <text x="571" y="290" text-anchor="middle" fill="#14532d">de documents</text>
  <rect x="350" y="318" width="290" height="46" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="495" y="346" text-anchor="middle" fill="#713f12">Bastion d'administration et chaîne CI/CD</text>

  <rect x="330" y="410" width="330" height="70" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="495" y="438" text-anchor="middle" font-weight="bold" fill="#14532d">Second site : sauvegardes</text>
  <text x="495" y="458" text-anchor="middle" fill="#14532d">service de l'hébergeur (activité 6)</text>

  <!-- Tiers -->
  <rect x="800" y="70" width="180" height="70" rx="8" fill="#fae8ff" stroke="#86198f"/>
  <text x="890" y="95" text-anchor="middle" font-weight="bold" fill="#581c87">Prestataire visio</text>
  <text x="890" y="114" text-anchor="middle" fill="#581c87">relais média (SFU), UE</text>
  <text x="890" y="130" text-anchor="middle" fill="#581c87">flux non enregistrés</text>

  <rect x="800" y="180" width="180" height="56" rx="8" fill="#fae8ff" stroke="#86198f"/>
  <text x="890" y="204" text-anchor="middle" font-weight="bold" fill="#581c87">Prestataire de paiement</text>
  <text x="890" y="222" text-anchor="middle" fill="#581c87">PCI DSS</text>

  <rect x="800" y="276" width="180" height="56" rx="8" fill="#fae8ff" stroke="#86198f"/>
  <text x="890" y="300" text-anchor="middle" font-weight="bold" fill="#581c87">Notifications</text>
  <text x="890" y="318" text-anchor="middle" fill="#581c87">SMS et e-mail, UE</text>

  <rect x="800" y="372" width="180" height="56" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="890" y="396" text-anchor="middle" font-weight="bold" fill="#1e293b">ANS</text>
  <text x="890" y="414" text-anchor="middle" fill="#1e293b">Pro Santé Connect, INSi</text>

  <!-- Flux -->
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M190 105 L350 145"/>
    <path d="M190 228 L350 160"/>
  </g>
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M640 140 L800 100"/>
    <path d="M640 205 L800 207"/>
    <path d="M640 218 L800 300"/>
    <path d="M190 455 L350 345"/>
    <path d="M495 380 L495 410"/>
  </g>
  <path d="M640 228 L800 396" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M190 82 C 400 34, 640 34, 800 84" stroke="#86198f" stroke-width="1.6" stroke-dasharray="5 4" fill="none" marker-end="url(#a)" marker-start="url(#a)"/>

  <g font-size="12" font-weight="bold" fill="#0f172a">
    <text x="252" y="104">F1</text>
    <text x="222" y="194">F2</text>
    <text x="150" y="50" fill="#86198f">F3 (audio et vidéo)</text>
    <text x="712" y="110">F4</text>
    <text x="712" y="198">F5</text>
    <text x="738" y="250">F6</text>
    <text x="706" y="338">F7</text>
    <text x="240" y="395">F8</text>
    <text x="505" y="400">F9</text>
  </g>

  <text x="500" y="540" text-anchor="middle" font-size="12" fill="#475569">Trait pointillé violet : flux média direct entre les terminaux et le prestataire visio. Le détail des flux F1 à F9 figure au §1.4.</text>
</svg>
